<header class="head">
  <input
    class="title"
    aria-label="Titre de la tâche"
    placeholder="Titre de la tâche"
    [value]="title()"
    (input)="title.set($any($event.target).value)"
  />
  <button type="button" class="icon-btn" title="Fermer" (click)="close()">
    <span class="material-symbols-outlined">close</span>
  </button>
</header>

<div class="fields">
  <label>
    <span>Statut</span>
    <select [value]="status()" (change)="status.set($any($event.target).value)">
      @for (s of statuses; track s) {
        <option [value]="s" [selected]="s === status()">{{ statusLabels[s] }}</option>
      }
    </select>
  </label>

  <label>
    <span>Priorité</span>
    <select [value]="priority()" (change)="priority.set($any($event.target).value)">
      @for (p of priorities; track p) {
        <option [value]="p" [selected]="p === priority()">{{ priorityLabels[p] }}</option>
      }
    </select>
  </label>

  <label>
    <span>Début</span>
    <input type="date" [value]="startDate()" (input)="startDate.set($any($event.target).value)" />
  </label>

  <label>
    <span>Échéance</span>
    <input type="date" [value]="dueDate()" (input)="dueDate.set($any($event.target).value)" />
  </label>

  <label>
    <span>Responsable</span>
    <input
      type="text"
      placeholder="Nom du responsable"
      [value]="assignedTo()"
      (input)="assignedTo.set($any($event.target).value)"
    />
  </label>
</div>

<div class="tags-field">
  <span class="label">Étiquettes</span>
  <div class="tags">
    @for (tag of tags(); track tag) {
      <span class="tag">
        {{ tag }}
        <button type="button" [attr.aria-label]="'Retirer ' + tag" (click)="removeTag(tag)">
          <span class="material-symbols-outlined">close</span>
        </button>
      </span>
    }
    <input
      type="text"
      placeholder="Ajouter une étiquette (Entrée)"
      [value]="newTag()"
      (input)="newTag.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); addTag()"
    />
  </div>
</div>

<div class="subtasks">
  <div class="subtasks-head">
    <span class="label">Sous-tâches</span>
    @if (checklist().length) {
      <span class="count">{{ subtasksDone() }}/{{ checklist().length }}</span>
      <span class="progress" role="progressbar" [attr.aria-valuenow]="subtasksProgress()">
        <span [style.width.%]="subtasksProgress()"></span>
      </span>
    }
  </div>

  <ul>
    @for (item of checklist(); track item.id) {
      <li [class.done]="item.completed">
        <input
          type="checkbox"
          [checked]="item.completed"
          [attr.aria-label]="'Terminer ' + item.label"
          (change)="toggleSubtask(item.id)"
        />
        <input
          type="text"
          class="subtask-label"
          [value]="item.label"
          (input)="renameSubtask(item.id, $any($event.target).value)"
        />
        <button
          type="button"
          class="icon-btn"
          title="Supprimer la sous-tâche"
          (click)="removeSubtask(item.id)"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </li>
    }
  </ul>

  <div class="add-subtask">
    <span class="material-symbols-outlined">add</span>
    <input
      type="text"
      placeholder="Ajouter une sous-tâche (Entrée)"
      [value]="newSubtask()"
      (input)="newSubtask.set($any($event.target).value)"
      (keydown.enter)="$event.preventDefault(); addSubtask()"
    />
  </div>
</div>

<div class="description">
  <span class="label">Description</span>
  <div class="editor">
    <app-editor [content]="content()" (contentChange)="updateContent($event)" />
  </div>
</div>

<footer class="actions">
  @if (!isNew) {
    <button type="button" class="btn-danger" (click)="remove()">
      <span class="material-symbols-outlined">delete</span>
      Supprimer
    </button>
  }
  <span class="spacer"></span>
  <button type="button" class="btn-secondary" (click)="close()">Annuler</button>
  <button type="button" class="btn-primary" (click)="save()">
    {{ isNew ? 'Créer la tâche' : 'Enregistrer' }}
  </button>
</footer>
