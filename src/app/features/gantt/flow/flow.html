<div
  class="flow-container"
  [style.width]="containerWidth()"
  [style.height]="containerHeight()"
  (click)="toggleAnimation()"
>
  <svg
    #svg
    class="flow-svg"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    preserveAspectRatio="xMidYMid meet"
  >
    <defs>
      <filter id="indicator-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="8" result="blur" />

        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- <marker
        id="arrow-flow"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="7"
        markerHeight="7"
        orient="auto-start-reverse"
      >
        <path d="M 0 0 L 10 5 L 0 10 z" />
      </marker> -->

      <marker
        id="arrow-success"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="7"
        markerHeight="7"
        orient="auto-start-reverse"
      >
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1db58b" />
      </marker>

      <marker
        id="arrow-error"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="7"
        markerHeight="7"
        orient="auto-start-reverse"
      >
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef3535" />
      </marker>

      <marker
        id="arrow-pending"
        viewBox="0 0 10 10"
        refX="8"
        refY="5"
        markerWidth="7"
        markerHeight="7"
        orient="auto-start-reverse"
      >
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c3ce" />
      </marker>
    </defs>

    <g class="flow-source">
      <rect x="40" y="210" width="220" height="100" rx="14" />

      <circle cx="85" cy="260" r="27" class="node-icon-background" />

      <text x="85" y="272" text-anchor="middle" class="material-symbols">
        {{ source().icon }}
      </text>

      <text x="125" y="250" class="node-title">
        {{ source().label }}
      </text>

      @if (source().description) {
        <text x="125" y="276" class="node-description">
          {{ source().description }}
        </text>
      }
    </g>

    @for (route of routes(); track route.id) {
      <path
        class="flow-path"
        [class.animated]="animatedArrows() && isPlaying()"
        [class.flow-success]="route.status === 'success'"
        [class.flow-error]="route.status === 'error'"
        [class.flow-pending]="route.status === 'pending'"
        [attr.data-flow-path]="route.id"
        [attr.d]="route.path"
        [attr.marker-end]="'url(#arrow-' + route.status + ')'"
      />

      <g class="destination">
        <rect
          [attr.x]="destinationX"
          [attr.y]="route.points[route.points.length - 1].y - 46"
          width="300"
          height="92"
          rx="14"
          [class]="statusClass(route.status)"
        />

        <circle
          [attr.cx]="destinationX + 45"
          [attr.cy]="route.points[route.points.length - 1].y"
          r="24"
          class="destination-icon-background"
        />

        <text
          [attr.x]="destinationX + 45"
          [attr.y]="route.points[route.points.length - 1].y + 13"
          text-anchor="middle"
          class="material-symbols destination-icon"
        >
          {{ route.destination.icon }}
        </text>

        <text
          [attr.x]="destinationX + 82"
          [attr.y]="route.points[route.points.length - 1].y - 7"
          class="node-title"
        >
          {{ route.destination.label }}
        </text>

        @if (route.destination.description) {
          <text
            [attr.x]="destinationX + 82"
            [attr.y]="route.points[route.points.length - 1].y + 18"
            class="node-description"
          >
            {{ route.destination.description }}
          </text>
        }

        <circle
          [attr.cx]="destinationX + 275"
          [attr.cy]="route.points[route.points.length - 1].y"
          r="14"
          class="status-indicator"
        />

        <text
          [attr.x]="destinationX + 275"
          [attr.y]="route.points[route.points.length - 1].y + 5"
          text-anchor="middle"
          class="material-symbols status-icon"
        >
          {{ statusIcon(route.status) }}
        </text>
      </g>
    }

    @if (animatedIndicator() && routes().length) {
      <circle
        data-flow-indicator
        class="flow-indicator"
        cx="260"
        cy="260"
        r="8"
        filter="url(#indicator-glow)"
      />

      <circle data-flow-indicator-core class="flow-indicator-core" cx="260" cy="260" r="4" />
    }
  </svg>
</div>
