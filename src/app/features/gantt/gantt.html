<h1>Planning</h1>

<div class="page">
  <app-flow
    [source]="source()"
    [destinations]="destinations()"
    [width]="1400"
    [height]="520"
    containerWidth="90%"
    containerHeight="520px"
    [indicatorDuration]="1800"
    [animatedArrows]="true"
    [animatedIndicator]="true"
  />
</div>

@for (task of tasks; track task.id) {
  <div class="line">
    <div class="name">
      {{ task.title }}
    </div>

    <div class="timeline">
      <div class="bar" [style.width.px]="100">{{ task.progress }} %</div>
    </div>
  </div>
}
