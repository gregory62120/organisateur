<div class="shell">
  <app-sidebar class="shell-sidebar" />

  <div class="shell-main">
    <header class="topbar">
      <div class="project">
        <span class="material-symbols-outlined">folder_open</span>
        @if (storage.root(); as root) {
          <span class="project-name">{{ root.name }}</span>
        } @else {
          <span class="project-name muted">Aucun projet ouvert</span>
        }
      </div>

      <div class="topbar-actions">
        @if (error(); as error) {
          <span class="status status-error" [title]="error">
            <span class="material-symbols-outlined">error</span>
            Erreur d'enregistrement
          </span>
        } @else if (saving()) {
          <span class="status">
            <span class="material-symbols-outlined spin">sync</span>
            Enregistrement…
          </span>
        } @else if (storage.isOpen()) {
          <span class="status status-ok">
            <span class="material-symbols-outlined">cloud_done</span>
            Enregistré
          </span>
        }

        <button type="button" class="btn-primary" (click)="openProject()">
          <span class="material-symbols-outlined">create_new_folder</span>
          {{ storage.isOpen() ? 'Changer de projet' : 'Ouvrir un projet' }}
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
