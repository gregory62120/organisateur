<div class="flex flex-col items-center gap-4 p-8 text-center">
  <div class="popup-container">
    <div class="icon-wrapper">
      <span class="material-symbols-outlined"> folder_open </span>
    </div>

    <div class="content">
      <h2 class="title">Aucun projet ouvert</h2>
      <p class="description">
        Aucun projet n'est actuellement ouvert. Ouvrez un dossier pour commencer à travailler sur
        votre projet.
      </p>
    </div>

    <button class="open-button" (click)="openProject()">
      <span class="material-symbols-outlined"> folder_open </span>
      Ouvrir un projet
    </button>
  </div>
</div>
